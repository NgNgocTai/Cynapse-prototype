<title>Nocpro Automation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
:root{
  --paper:#e9edec; --surface:#fbfcfb; --surface-2:#f2f5f4; --wash:#e2e8e6;
  --ink:#11171a; --ink-2:#4b5a57; --ink-3:#7b8c88;
  --rule:#d5dcda; --rule-2:#bcc7c4;
  --accent:#0d666d; --accent-wash:#dceceb; --accent-ink:#0a4f55;
  --brass:#8d6416; --brass-wash:#f4ecd9;
  --ok:#2c6949; --ok-wash:#dcece2;
  --warn:#8d6416; --warn-wash:#f4ecd9;
  --crit:#9a3520; --crit-wash:#f6e2dc;
  --info:#2a5a8d; --info-wash:#dde7f2;
  --ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Source Serif 4",Georgia,serif;
  --sb:250px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b1012; --surface:#141b1d; --surface-2:#1b2426; --wash:#212c2e;
  --ink:#e8eeec; --ink-2:#95a6a2; --ink-3:#6e807c;
  --rule:#273234; --rule-2:#374749;
  --accent:#54bfc4; --accent-wash:#123034; --accent-ink:#7fd4d8;
  --brass:#d6a556; --brass-wash:#2e2413;
  --ok:#6bbf90; --ok-wash:#12291d;
  --warn:#d6a556; --warn-wash:#2e2413;
  --crit:#e0836c; --crit-wash:#331913;
  --info:#7fb0e0; --info-wash:#14212e;
}}
:root[data-theme="dark"]{
  --paper:#0b1012; --surface:#141b1d; --surface-2:#1b2426; --wash:#212c2e;
  --ink:#e8eeec; --ink-2:#95a6a2; --ink-3:#6e807c;
  --rule:#273234; --rule-2:#374749;
  --accent:#54bfc4; --accent-wash:#123034; --accent-ink:#7fd4d8;
  --brass:#d6a556; --brass-wash:#2e2413;
  --ok:#6bbf90; --ok-wash:#12291d;
  --warn:#d6a556; --warn-wash:#2e2413;
  --crit:#e0836c; --crit-wash:#331913;
  --info:#7fb0e0; --info-wash:#14212e;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
.sb{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--rule)}
.brand .nm{font-size:15px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.navgrp{padding:14px 10px 4px}
.navgrp h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px 8px;font-weight:500}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--ink-2);padding:7px 9px;border-radius:5px;font-size:13.5px;font-weight:500}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .ct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--wash);padding:1px 5px;border-radius:9px}
.nav[aria-current="true"] .ct{background:var(--surface);color:var(--accent-ink)}
.sbfoot{margin-top:auto;padding:12px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.sbfoot .who{font-size:12px;font-weight:600;line-height:1.25}
.sbfoot .role{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.themebtn{margin-left:auto;background:none;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:5px;padding:4px 7px;font-family:var(--mono);font-size:10px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.crumb b{color:var(--ink);font-weight:500}
.topbar .sp{margin-left:auto}
.envsel{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink);border-radius:5px;padding:5px 8px}
.sbtoggle{display:none;background:var(--surface-2);border:1px solid var(--rule-2);border-radius:5px;padding:5px 9px;color:var(--ink)}
.page{padding:26px;max-width:1320px}

/* ---------- headings ---------- */
.ph{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
h3{font-size:12.5px;font-weight:600;margin:0}
.lede{color:var(--ink-2);font-size:13.5px;max-width:80ch;margin:4px 0 0}
.ph .sp{margin-left:auto}
.sect{margin-top:26px}
.sect>.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sect>.hd .sp{margin-left:auto}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:7px}
.panel>.hd{padding:12px 15px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>.hd .sp{margin-left:auto}
.panel>.bd{padding:15px}
.panel>.bd.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{background:var(--surface-2);border:1px solid var(--rule-2);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri,:root:not([data-theme="light"]) .btn.pri{color:#08181a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.pri:hover{color:#08181a}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.04em;padding:2px 7px;border-radius:11px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-wash)}
.p-warn{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}
.p-crit{color:var(--crit);border-color:var(--crit);background:var(--crit-wash)}
.p-info{color:var(--info);border-color:var(--info);background:var(--info-wash)}
.p-accent{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-wash)}
.p-mute{color:var(--ink-3);border-color:var(--rule-2);background:var(--surface-2)}
.tier{display:inline-grid;place-items:center;width:24px;height:19px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:700;border:1px solid}
.t1{color:var(--ok);border-color:var(--ok);background:var(--ok-wash)}
.t2{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-wash)}
.t3{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}
.t4{color:var(--crit);border-color:var(--crit);background:var(--crit-wash)}

/* stat tiles */
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:13px 15px;position:relative;overflow:hidden}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1}
.stat .d{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.stat .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.spark i{flex:1;background:var(--accent-wash);border-top:2px solid var(--accent);min-height:2px}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:500;padding:9px 14px;border-bottom:1px solid var(--rule-2);background:var(--surface-2);position:sticky;top:0}
tbody td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-2)}
td.m,th.m{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
td .sub{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* code */
pre{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:11.5px;line-height:1.6;margin:0;color:var(--ink)}
pre .c{color:var(--ink-3)}
pre .k{color:var(--accent-ink);font-weight:500}
pre .s{color:var(--brass)}
pre .add{color:var(--ok)}
pre .del{color:var(--crit)}
code{font-family:var(--mono);font-size:.9em;background:var(--wash);padding:.08em .32em;border-radius:3px}

/* def list */
.dl{display:grid;grid-template-columns:160px 1fr;gap:0}
.dl>div{padding:9px 0;border-bottom:1px solid var(--rule);display:contents}
.dl dt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 14px 9px 0;border-bottom:1px solid var(--rule)}
.dl dd{margin:0;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
@media (max-width:700px){.dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:0}}

/* banner */
.banner{border-radius:7px;padding:12px 15px;border:1px solid;display:flex;gap:12px;align-items:flex-start;font-size:13px;margin-top:14px}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:1.7}
.banner b{display:block;margin-bottom:3px;font-size:13px}
.b-warn{border-color:var(--warn);background:var(--warn-wash);color:var(--warn)}
.b-crit{border-color:var(--crit);background:var(--crit-wash);color:var(--crit)}
.b-ok{border-color:var(--ok);background:var(--ok-wash);color:var(--ok)}
.b-info{border-color:var(--info);background:var(--info-wash);color:var(--info)}
.banner .tx{color:var(--ink);flex:1}
.banner .tx p{margin:0;color:var(--ink-2);font-size:12.5px}

/* form */
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.fld .hint{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:4px}
.fld .req{color:var(--crit);margin-left:3px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--rule-2);color:var(--ink);border-radius:6px;padding:7px 10px;font-family:var(--ui);font-size:13px}
input.mono,select.mono{font-family:var(--mono);font-size:12.5px}
textarea{font-family:var(--mono);font-size:12px;line-height:1.6;min-height:120px;resize:vertical}
input:invalid{border-color:var(--crit)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.schemachip{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);border:1px dashed var(--rule-2);border-radius:4px;padding:1px 5px;margin-left:6px}

/* steps / loop */
.loop{display:grid;gap:0;grid-template-columns:repeat(6,1fr);margin-top:12px}
.lstep{border:1px solid var(--rule);border-right:0;padding:11px 12px;background:var(--surface-2);position:relative}
.lstep:last-child{border-right:1px solid var(--rule)}
.lstep:first-child{border-radius:6px 0 0 6px}
.lstep:last-child{border-radius:0 6px 6px 0}
.lstep .n{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3)}
.lstep .t{font-size:11.5px;font-weight:600;margin-top:3px;line-height:1.3}
.lstep .s{font-family:var(--mono);font-size:9.5px;margin-top:6px;color:var(--ink-3)}
.lstep.done{background:var(--ok-wash);border-color:var(--ok)}
.lstep.done .s{color:var(--ok)}
.lstep.run{background:var(--accent-wash);border-color:var(--accent)}
.lstep.run .s{color:var(--accent-ink)}
.lstep.fail{background:var(--crit-wash);border-color:var(--crit)}
.lstep.fail .s{color:var(--crit)}
.lstep.roll{background:var(--warn-wash);border-color:var(--warn)}
.lstep.roll .s{color:var(--warn)}
@media (max-width:900px){.loop{grid-template-columns:repeat(2,1fr)}.lstep{border-right:1px solid var(--rule);border-radius:6px!important;margin-bottom:-1px}}

.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:1px;background:var(--rule-2)}
.timeline li:last-child{padding-bottom:0}
.timeline li:last-child::before{display:none}
.timeline .mk{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:700;border:1px solid;background:var(--surface)}
.timeline .ti{font-size:13px;font-weight:600}
.timeline .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}

/* matrix */
.mx{overflow:auto;max-height:520px}
.mx table{min-width:820px;font-size:12px}
.mx thead th{padding:8px 10px;font-size:9px}
.mx thead th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:112px;vertical-align:bottom;padding:8px 4px;white-space:nowrap}
.mx tbody td{padding:6px 10px;text-align:center;border-right:1px solid var(--rule)}
.mx tbody td:first-child{text-align:left;font-family:var(--mono);font-size:11.5px;position:sticky;left:0;background:var(--surface);z-index:2}
.cell{display:inline-grid;place-items:center;width:22px;height:18px;border-radius:3px;font-family:var(--mono);font-size:9px;font-weight:700;border:1px solid}
.c-tested{color:var(--ok);border-color:var(--ok);background:var(--ok-wash)}
.c-exp{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}
.c-none{color:var(--ink-3);border-color:var(--rule-2);background:var(--surface-2)}

/* misc */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);padding:8px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.stepcard{border:1px solid var(--rule);border-radius:6px;padding:11px 13px;background:var(--surface-2);margin-bottom:9px}
.stepcard .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stepcard .idx{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:16px}
.stepcard .cap{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--accent-ink)}
.stepcard .args{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:6px;padding-left:25px;line-height:1.7}
.stepcard .sp{margin-left:auto}
.prose{font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:74ch}
.ownlist{list-style:none;padding:0;margin:0;font-family:var(--mono);font-size:11.5px}
.ownlist li{padding:5px 0;border-bottom:1px dashed var(--rule);display:flex;gap:9px;align-items:center}
.ownlist li:last-child{border-bottom:0}
.diffbox{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.diffbox .dh{padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.diffbox pre{border:0;border-radius:0;background:var(--surface)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;width:var(--sb);z-index:60;transform:translateX(-100%);transition:transform .16s ease;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  .sb.open{transform:none;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .sbtoggle{display:inline-flex}
  .page{padding:18px}
  .topbar{padding:10px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<g id="i-blocks"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="8.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="8.5" width="5.5" height="5.5" rx="1"/><path d="M8.5 11.2h5.5"/></g>

<script>
/* =========================================================================
   HELPERS
   ========================================================================= */
const $ = s=>document.querySelector(s);
const h = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dev = id=>DEVICES.find(d=>d.id===id);
const tierOf = id=>{const d=dev(id);return d?PROFILES[d.profile].tier:0;};
const tierBadge = t=>`<span class="tier t${t}" title="Tầng năng lực T${t}">T${t}</span>`;
const TIERNAME={1:'model-driven',2:'resource module',3:'CLI template',4:'screen-scrape'};

function matchScope(op,d){const s=op.scope||{};return (!s.role||d.role===s.role);}

function ifaces(devId){
  const d=dev(devId); if(!d) return [];
  const p=d.profile;
  const pre = p.startsWith('cisco.nxos')?'Ethernet1/' : p.startsWith('arista')?'Ethernet'
            : p.startsWith('juniper')?'ge-0/0/' : p.startsWith('cisco.iosxe')?'GigabitEthernet1/0/'
            : p.startsWith('rhel')?'ens' : 'FastEthernet0/';
  const n = p.startsWith('cisco.ios.12x')?24 : p.startsWith('rhel')?3 : p.startsWith('cisco.nxos')?36:48;
  const out=[];
  for(let i=1;i<=n;i++){
    const seed=(devId.length*7+i*13)%10;
    out.push({name:pre+i, free:seed<4, desc:seed<4?'':(['SRV-FARM','VOICE','PRINTER','GUEST','CCTV'][seed%5]+'/CR-4'+(300+i))});
  }
  return out;
}

const PORTS=[{id:'tcp/443',name:'HTTPS tcp/443'},{id:'tcp/8080',name:'HTTP-alt tcp/8080'},{id:'tcp/22',name:'SSH tcp/22'},{id:'tcp/1521',name:'Oracle tcp/1521'},{id:'udp/161',name:'SNMP udp/161'}];
const SITES=[...new Set(DEVICES.map(d=>d.site))];

/* --- sinh lệnh dự kiến theo tầng và họ thiết bị --- */
function predict(capId,args,prof){
  const t=PROFILES[prof].tier;
  const fam = prof.startsWith('cisco.nxos')?'nxos' : prof.startsWith('arista')?'eos'
            : prof.startsWith('juniper')?'junos' : prof.startsWith('paloalto')?'panos'
            : prof.startsWith('f5')?'bigip' : prof.startsWith('rhel')?'linux':'ios';
  const A=args;
  if(t===1&&(fam==='nxos'||fam==='junos')) {
    const body={'vlan.ensure':`<vlans><vlan><vlan-id>${A.vlan_id}</vlan-id><name>${A.name||''}</name></vlan></vlans>`,
      'interface.access_vlan.set':`<interface><name>${A.interface}</name><access-vlan>${A.vlan_id}</access-vlan></interface>`,
      'interface.description.set':`<interface><name>${A.interface}</name><description>${A.text}</description></interface>`,
      'interface.admin_state.set':`<interface><name>${A.interface}</name><enabled>${A.state==='up'}</enabled></interface>`,
      'routing.static_route.ensure':`<static-routes><route><prefix>${A.prefix}</prefix><next-hop>${A.next_hop}</next-hop></route></static-routes>`,
      'ntp.server.ensure':`<ntp><servers>${A.servers}</servers></ntp>`}[capId];
    return [`# NETCONF <edit-config> vào candidate, rồi <commit confirmed="5m">`, body||`# payload cho ${capId}`];
  }
  if(t===1&&fam==='eos') return [`# eAPI JSON-RPC runCmds (configure session + commit)`,`["configure session ${A.ticket||'auto'}", ...]`];
  if(t===1&&fam==='panos'){
    if(capId==='firewall.address_object.ensure') return [`POST /restapi/v11.0/Objects/Addresses?name=${A.name}`,`{"entry":{"@name":"${A.name}","ip-netmask":"${A.cidr}"}}`];
    return [`POST /restapi/v11.0/Policies/SecurityRules?name=${A.name}`,`{"entry":{"@name":"${A.name}","source":["${A.src}"],"destination":["${A.dst}"],"service":["${A.service}"],"action":"${A.action}"}}`,`POST /api/?type=commit`];
  }
  if(t===1&&fam==='bigip') return [`PATCH /mgmt/tm/ltm/pool/${A.pool}/members/${(A.member||'').replace(':','~')}`,`{"state":"${A.state==='drain'?'user-up':'user-down'}","session":"user-disabled"}`];
  if(fam==='linux'){
    if(capId==='ntp.server.ensure') return [`# ansible: chrony`,`server ${String(A.servers).split(',').join('\nserver ')} iburst`];
    return [`# ansible: dnf name=${A.name} state=present`];
  }
  const L=[];
  if(capId==='device.config.backup') return [`show running-config   ${t===4?'(qua telnet, terminal length 0 trước)':''}`];
  if(capId==='device.config.restore') return t===4?[`copy tftp://10.0.0.9/${A.snapshot}.cfg running-config`]:[`configure replace flash:${A.snapshot}.cfg force`];
  L.push('configure terminal');
  switch(capId){
    case 'vlan.ensure': L.push(`vlan ${A.vlan_id}`, ` name ${A.name||'VLAN'+A.vlan_id}`, 'exit'); break;
    case 'vlan.delete': L.push(`no vlan ${A.vlan_id}`); break;
    case 'interface.access_vlan.set': L.push(`interface ${A.interface}`,' switchport mode access',` switchport access vlan ${A.vlan_id}`,'exit'); break;
    case 'interface.trunk_vlans.set': L.push(`interface ${A.interface}`,` switchport trunk allowed vlan add ${String(A.vlans).replace('+','')}`,'exit'); break;
    case 'interface.description.set': L.push(`interface ${A.interface}`,` description ${A.text}`,'exit'); break;
    case 'interface.admin_state.set': L.push(`interface ${A.interface}`,A.state==='up'?' no shutdown':' shutdown','exit'); break;
    case 'routing.static_route.ensure': L.push(`ip route ${A.prefix} ${A.next_hop}`); break;
    case 'ntp.server.ensure': String(A.servers).split(',').forEach(s=>L.push(`ntp server ${s.trim()}`)); break;
    default: L.push(`! ${capId}`);
  }
  L.push('end');
  if(t===4) L.push('write memory','! + hẹn dead-man: reload in 5');
  else L.push('write memory');
  return L;
}

/* --- biên dịch nghiệp vụ (compile-on-save) --- */
function compileOp(op){
  const errs=[],warns=[],infos=[];
  const formIds=new Set(op.form.map(f=>f.id));
  const targets=DEVICES.filter(d=>matchScope(op,d));
  const profs=[...new Set(targets.map(d=>d.profile))];
  op.plan.forEach((st,i)=>{
    const n=i+1, cap=CAPBY[st.use];
    if(!cap){errs.push({n,msg:`capability <code>${h(st.use)}</code> không tồn tại trong catalog`});return;}
    cap.inputs.filter(x=>x.req).forEach(x=>{ if(!(x.n in st.with)) errs.push({n,msg:`thiếu tham số bắt buộc <code>${x.n}</code> của <code>${cap.id}</code>`}); });
    Object.keys(st.with).forEach(k=>{ if(!cap.inputs.some(x=>x.n===k)) errs.push({n,msg:`<code>${cap.id}</code> không nhận tham số <code>${h(k)}</code>`}); });
    Object.values(st.with).forEach(v=>{
      if(typeof v!=='string')return;
      (v.match(/\$[a-zA-Z_]+(\.[a-zA-Z_]+)?/g)||[]).forEach(ref=>{
        const base=ref.slice(1).split('.')[0];
        if(base!=='each_device'&&!formIds.has(base)) errs.push({n,msg:`tham chiếu <code>${h(ref)}</code> không khớp trường nào trong form`});
      });
    });
    const miss=profs.filter(p=>!cap.bind[p]);
    if(miss.length){
      const cnt=targets.filter(d=>miss.includes(d.profile)).length;
      errs.push({n,msg:`<code>${cap.id}</code> chưa có driver cho ${miss.map(m=>h(PROFILES[m].label)).join(', ')} — <b>${cnt} thiết bị</b> trong phạm vi sẽ thất bại khi chạy`});
    }
    const exp=profs.filter(p=>cap.bind[p]&&cap.bind[p].status==='experimental');
    if(exp.length){
      const cnt=targets.filter(d=>exp.includes(d.profile)).length;
      warns.push({n,msg:`driver cho ${exp.map(m=>h(PROFILES[m].label)).join(', ')} đang ở mức <b>thử nghiệm</b> — ${cnt} thiết bị, cần snapshot và kiểm chứng bắt buộc`});
    }
    (cap.pre||[]).forEach(p=>{
      const ok=op.plan.slice(0,i).some(s=>s.use===p||s.use.startsWith(p));
      if(!ok) infos.push({n,msg:`tiền điều kiện <code>${h(p)}</code> không được bước nào trước đó đảm bảo — nền tảng sẽ tự kiểm tra lúc chạy`});
    });
  });
  return {errs,warns,infos,targets,profs};
}

  </div>

  <div class="grid g2 sect">
    <div class="panel"><div class="hd"><h2>Lần chạy gần nhất</h2><div class="sp"></div><button class="btn sm" data-go="runs">Tất cả</button></div>
      <div class="bd flush"><div class="tw"><table><thead><tr><th>Run</th><th>Nghiệp vụ</th><th>Đích</th><th>Trạng thái</th></tr></thead><tbody>
        ${RUNS.slice(0,5).map(r=>`<tr class="clk" data-run="${r.id}">
          <td class="m">${r.id}<div class="sub">${h(r.at)}</div></td>
          <td>${h(OPBY[r.op].title)}<div class="sub">v${r.opv} · ${h(r.by)}</div></td>
          <td class="m">${r.targets.length===1?h(r.targets[0]):r.targets.length+' thiết bị'}</td>
          <td>${runPill(r.status)}</td></tr>`).join('')}
      </tbody></table></div></div>
    </div>

    <div class="panel"><div class="hd"><h2>Chờ phê duyệt</h2><div class="sp"></div><button class="btn sm" data-go="approvals">Tất cả</button></div>
      <div class="bd">
        ${APPROVALS.filter(a=>a.state==='pending').map(a=>`
        <div class="stepcard"><div class="top">
          <span class="cap">${a.id}</span>
          <span class="pill p-warn">${h(a.reason)}</span>
          <div class="sp"></div>
          ${Object.entries(a.tiers).map(([t,n])=>`${tierBadge(t)}<span class="kv" style="margin-right:6px">×${n}</span>`).join('')}
        </div>
        <div class="args" style="padding-left:0;margin-top:7px;font-family:var(--ui);font-size:12.5px">${h(a.summary)}</div>
        <div class="row" style="margin-top:9px"><button class="btn sm" data-go="approvals">Xem chi tiết</button><span class="kv">${h(a.by)} · ${h(a.at)}</span></div>
        </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="sect panel">
    <div class="hd"><h2>Độ phủ capability theo profile</h2><div class="sp"></div><span class="eyebrow">${covered} capability × ${Object.keys(PROFILES).length} profile</span><button class="btn sm" data-go="drivers">Xem ma trận đầy đủ</button></div>
    <div class="bd flush"><div class="tw"><table><thead><tr><th>Profile</th><th>Tầng</th><th>Giao thức</th><th class="num">Đã kiểm thử</th><th class="num">Thử nghiệm</th><th>Độ phủ</th></tr></thead><tbody>
      ${Object.entries(PROFILES).map(([k,p])=>{
        const tested=CAPS.filter(c=>c.bind[k]&&c.bind[k].status==='tested').length;
        const exp=CAPS.filter(c=>c.bind[k]&&c.bind[k].status==='experimental').length;
        const pct=Math.round((tested+exp)/CAPS.length*100);
        return `<tr><td class="m">${h(k)}<div class="sub">${h(p.label)}</div></td><td>${tierBadge(p.tier)}</td>
          <td class="m" style="font-size:11px">${p.proto.map(x=>h(x)).join(' · ')}</td>
          <td class="num">${tested}</td><td class="num">${exp||'—'}</td>
          <td><div class="row"><div class="bar" style="flex:1"><i style="width:${pct}%;background:${pct>60?'var(--ok)':pct>35?'var(--warn)':'var(--crit)'}"></i></div><span class="kv">${pct}%</span></div></td></tr>`;
      }).join('')}
    </tbody></table></div></div>
  </div>`;
};

function runPill(s){
  return {success:'<span class="pill p-ok">thành công</span>',
    failed_rolled_back:'<span class="pill p-crit">thất bại · đã hoàn</span>',
    partial:'<span class="pill p-warn">một phần</span>',
    blocked:'<span class="pill p-mute">bị chặn bởi policy</span>',
    running:'<span class="pill p-accent">đang chạy</span>'}[s]||s;
}

/* =========================================================================
   VIEW · DANH MỤC NGHIỆP VỤ  (mặt tự phục vụ)
   ========================================================================= */
VIEWS.ops=()=>`
  <div class="ph"><div>
    <h1>Danh mục nghiệp vụ</h1>
    <p class="lede">Đây là toàn bộ mặt tiếp xúc của người vận hành. Chọn một nghiệp vụ, điền form, xem plan, rồi chạy — không cần biết thiết bị thuộc hãng nào hay tầng nào.</p>
  </div><div class="sp"></div><button class="btn" data-go="composer"><svg viewBox="0 0 16 16"><use href="#i-plus"/></svg>Tạo nghiệp vụ mới</button></div>

  <div class="grid g2 sect">
  ${OPS.map(o=>{
    const c=compileOp(o), broken=c.errs.length>0;
    return `<div class="panel"><div class="bd">
      <div class="row" style="margin-bottom:8px">
        <h2>${h(o.title)}</h2><div class="sp"></div>
        ${o.status==='published'?'<span class="pill p-ok">đã phát hành</span>':'<span class="pill p-mute">bản nháp</span>'}
        ${broken?`<span class="pill p-crit">${c.errs.length} lỗi biên dịch</span>`:''}
      </div>
      <div class="kv" style="margin-bottom:9px"><b>${h(o.id)}</b> · v${o.v} · ${h(o.owner)}</div>
      <p class="lede" style="font-size:13px;margin:0 0 11px">${h(o.desc)}</p>
      <div class="dl" style="grid-template-columns:118px 1fr">
        <dt>Số bước</dt><dd>${o.plan.length} capability</dd>
        <dt>Bán kính</dt><dd>${[...new Set(o.plan.map(s=>CAPBY[s.use]?CAPBY[s.use].blast:'?'))].join(', ')}</dd>
        <dt>Phê duyệt</dt><dd>${o.policy.approval==='none'?'<span class="pill p-ok">không cần</span>':o.policy.approval==='always'?'<span class="pill p-warn">luôn cần</span>':`<span class="pill p-info">có điều kiện</span> <code>${h(o.policy.approval)}</code>`}</dd>
        <dt>Đã chạy 30 ngày</dt><dd>${o.runs30} lần</dd>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn pri" data-launch="${o.id}" ${o.status!=='published'?'disabled':''}><svg viewBox="0 0 16 16"><use href="#i-play"/></svg>Chạy</button>
        <button class="btn sm" data-comp="${o.id}">Mở trong Composer</button>
      </div>
      ${o.status!=='published'?`<div class="banner b-crit" style="margin-top:12px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx"><b>Không chạy được</b><p>Bản nháp có ${c.errs.length} lỗi biên dịch. Mở trong Composer để xem.</p></div></div>`:broken?`<div class="banner b-warn" style="margin-top:12px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx"><b>Đã phát hành nhưng registry thay đổi sau đó</b><p>Khi phát hành, phạm vi chưa có thiết bị nào thiếu driver. Registry đã thêm thiết bị mới nên nghiệp vụ này bị đánh dấu lại — chạy được trên phần còn lại, nhưng ${c.errs.length} bước sẽ thất bại trên các thiết bị đó.</p></div></div>`:''}
    </div></div>`;
  }).join('')}
  </div>`;

/* =========================================================================
   VIEW · CHẠY NGHIỆP VỤ (form sinh tự động + plan preview)
   ========================================================================= */
VIEWS.launch=()=>{
  const op=OPBY[S.launch.op]; if(!op) return '<div class="empty">Chưa chọn nghiệp vụ</div>';
  const I=S.launch.inputs;
  const targets=resolveTargets(op,I);
  const tiers={}; targets.forEach(t=>{const x=tierOf(t);tiers[x]=(tiers[x]||0)+1;});
  const worst=Math.max(0,...targets.map(tierOf));
  const needApproval = op.policy.approval==='always' || (op.policy.approval!=='none' && (worst===4 || targets.some(t=>dev(t).role==='core')));
  const missing=op.form.filter(f=>f.req&&!I[f.id]);
  const ready=missing.length===0&&targets.length>0;

  return `
  <div class="ph"><div>
    <div class="eyebrow">${h(op.id)} · v${op.v}</div>
    <h1>${h(op.title)}</h1>
    <p class="lede">${h(op.desc)}</p>
  </div><div class="sp"></div><button class="btn" data-go="ops">← Danh mục</button></div>

  <div class="grid sect" style="grid-template-columns:minmax(320px,400px) 1fr;align-items:start">
    <div class="panel"><div class="hd"><h2>Thông tin đầu vào</h2><div class="sp"></div><span class="eyebrow">sinh từ schema</span></div>
      <div class="bd">
        ${op.form.map(f=>field(f,I)).join('')}
        <div class="banner b-info" style="margin-top:4px"><svg viewBox="0 0 16 16"><use href="#i-info"/></svg><div class="tx">
          <b>Form này không được viết tay</b><p>Mỗi trường sinh ra từ <code>inputs</code> của capability và <code>form</code> của nghiệp vụ. Thêm tham số vào capability là form tự có thêm ô.</p></div></div>
      </div>
    </div>

    <div>
      ${targets.length?`
      <div class="panel"><div class="hd"><h2>Phạm vi mục tiêu</h2><div class="sp"></div>
        ${Object.entries(tiers).sort().map(([t,n])=>`${tierBadge(t)}<span class="kv" style="margin:0 8px 0 3px">×${n}</span>`).join('')}
        <span class="pill p-mute">${targets.length} thiết bị</span></div>
        <div class="bd flush"><div class="tw"><table><thead><tr><th>Thiết bị</th><th>Profile</th><th>Tầng</th><th>Đảm bảo</th></tr></thead><tbody>
          ${targets.map(t=>{const d=dev(t),p=PROFILES[d.profile],tt=p.tier;return `<tr><td class="m">${h(t)}<div class="sub">${h(d.site)} · ${h(d.role)}</div></td>
            <td class="m" style="font-size:11.5px">${h(p.label)}</td><td>${tierBadge(tt)}</td>
            <td class="m" style="font-size:11px">${tt<=2?'<span class="pill p-ok">idempotent + diff</span>':tt===3?'<span class="pill p-warn">bù trừ phía nền tảng</span>':'<span class="pill p-crit">chỉ snapshot + kiểm chứng</span>'}</td></tr>`;}).join('')}
        </tbody></table></div></div>
      </div>`:`<div class="panel"><div class="empty">Chọn thiết bị hoặc site để thấy phạm vi mục tiêu.</div></div>`}

      ${worst>=3?`<div class="banner ${worst===4?'b-crit':'b-warn'}"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx">
        <b>Phạm vi có thiết bị tầng T${worst} — nền tảng tự siết luật an toàn</b>
        <p>Bắt buộc chụp snapshot trước · bắt buộc kiểm chứng sau khi áp · <code>serial = 1</code> (chạy tuần tự)${worst===4?' · bắt buộc phê duyệt · bật dead-man switch <code>reload in 5</code>':''}. Bạn không cần cấu hình gì thêm.</p></div></div>`:''}

      ${needApproval?`<div class="banner b-info"><svg viewBox="0 0 16 16"><use href="#i-shield"/></svg><div class="tx">
        <b>Cần phê duyệt trước khi áp</b><p>Điều kiện policy: <code>${h(op.policy.approval)}</code>. Plan sẽ được gửi vào hàng chờ phê duyệt thay vì chạy ngay.</p></div></div>`:''}

      ${missing.length?`<div class="banner b-warn"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx">
        <b>Còn ${missing.length} trường bắt buộc chưa điền</b><p>${missing.map(f=>h(f.label)).join(' · ')}</p></div></div>`:''}

      <div class="row sect">
        <button class="btn pri" id="btnplan" ${ready?'':'disabled'}>Xem plan (dry-run)</button>
        <button class="btn" id="btnfill">Điền dữ liệu mẫu</button>
        ${S.launch.planned?`<button class="btn ${needApproval?'':'pri'}" id="btnexec">${needApproval?'Gửi phê duyệt':'Áp thay đổi'}</button>`:''}
      </div>

      ${S.launch.planned?planPanel(op,I,targets,worst):''}
    </div>
  </div>`;
};

function field(f,I){
  const v=I[f.id]??'';
  const lbl=`<label for="f-${f.id}">${h(f.label)}${f.req?'<span class="req">*</span>':''}<span class="schemachip">${h(f.type)}</span></label>`;
  if(f.type==='device_picker'){
    const list=DEVICES.filter(d=>!f.filter||!f.filter.role||d.role===f.filter.role);
    return `<div class="fld">${lbl}<select class="mono" id="f-${f.id}" data-fld="${f.id}"><option value="">— chọn thiết bị —</option>
      ${list.map(d=>`<option value="${d.id}" ${v===d.id?'selected':''}>${d.id} · T${PROFILES[d.profile].tier} · ${d.site}</option>`).join('')}</select>
      <div class="hint">lọc theo scope: role = ${h(f.filter&&f.filter.role||'mọi role')} · ${list.length} thiết bị</div></div>`;
  }
  if(f.type==='interface_picker'){
    const parent=I[f.of];
    if(!parent) return `<div class="fld">${lbl}<select class="mono" disabled><option>— chọn ${h(f.of)} trước —</option></select><div class="hint">phụ thuộc trường <code>${h(f.of)}</code></div></div>`;
    const list=ifaces(parent), free=list.filter(x=>x.free);
    return `<div class="fld">${lbl}<select class="mono" id="f-${f.id}" data-fld="${f.id}"><option value="">— chọn port —</option>
      ${free.map(x=>`<option value="${x.name}" ${v===x.name?'selected':''}>${x.name} · trống</option>`).join('')}
      ${list.filter(x=>!x.free).slice(0,8).map(x=>`<option value="${x.name}" ${v===x.name?'selected':''}>${x.name} · đang dùng (${x.desc})</option>`).join('')}
      </select><div class="hint">${free.length} port trống trên ${h(parent)}</div></div>`;
  }
  if(f.type==='enum'){
    const src=f.source==='services'?SERVICES.map(s=>({v:s.id,l:`${s.name} — VLAN ${s.vlan}`}))
      :f.source==='ports'?PORTS.map(p=>({v:p.id,l:p.name}))
      :SITES.map(s=>({v:s,l:s+` (${DEVICES.filter(d=>d.site===s).length} thiết bị)`}));
    return `<div class="fld">${lbl}<select class="mono" id="f-${f.id}" data-fld="${f.id}"><option value="">— chọn —</option>
      ${src.map(o=>`<option value="${h(o.v)}" ${v===o.v?'selected':''}>${h(o.l)}</option>`).join('')}</select>
      <div class="hint">nguồn: <code>catalog.${h(f.source)}</code></div></div>`;
  }
  if(f.type==='integer'){
    return `<div class="fld">${lbl}<input class="mono" type="number" id="f-${f.id}" data-fld="${f.id}" value="${h(v)}" min="${f.min??''}" max="${f.max??''}" placeholder="${h(f.ph||'')}">
      <div class="hint">khoảng cho phép: ${f.min}..${f.max}</div></div>`;
  }
  return `<div class="fld">${lbl}<input class="mono" type="text" id="f-${f.id}" data-fld="${f.id}" value="${h(v)}" placeholder="${h(f.ph||'')}" ${f.pattern?`pattern="${h(f.pattern)}"`:''}>
    ${f.pattern?`<div class="hint">phải khớp <code>${h(f.pattern)}</code></div>`:''}</div>`;
}

function resolveTargets(op,I){
  if(op.form.some(f=>f.type==='device_picker')) return I.device?[I.device]:[];
  if(I.site) return DEVICES.filter(d=>d.site===I.site&&matchScope(op,d)).map(d=>d.id);
  return [];
}

function subst(v,I){
  if(typeof v!=='string')return v;
  return v.replace(/\$([a-zA-Z_]+)(?:\.([a-zA-Z_]+))?/g,(m,a,b)=>{
    if(a==='service'&&b){const s=SERVICES.find(x=>x.id===I.service);return s?s[b]:m;}
    if(a==='each_device')return '<thiết bị>';
    return I[a]!==undefined?I[a]:m;
  });
}

function planPanel(op,I,targets,worst){
  const rows=[];
  targets.forEach(t=>{
    const d=dev(t),prof=d.profile;
    op.plan.forEach((st,i)=>{
      const cap=CAPBY[st.use], b=cap&&cap.bind[prof];
      const args={}; Object.entries(st.with).forEach(([k,v])=>args[k]=subst(v,I));
      rows.push({t,i:i+1,cap:st.use,title:cap?cap.title:'—',b,args,prof,tier:b?b.tier:PROFILES[prof].tier,cmds:b?predict(st.use,args,prof):null});
    });
  });
  const blocked=rows.filter(r=>!r.b);
  return `
  <div class="sect panel"><div class="hd"><h2>Plan dự kiến</h2><div class="sp"></div>
    <span class="pill p-mute">${rows.length} bước × thiết bị</span>
    ${blocked.length?`<span class="pill p-crit">${blocked.length} bước không có driver</span>`:'<span class="pill p-ok">mọi bước đều có driver</span>'}</div>
    <div class="bd flush"><div class="tw"><table><thead><tr><th>#</th><th>Capability</th><th>Thiết bị</th><th>Driver được chọn</th><th>Tham số sau khi thế</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="m">${r.i}</td>
        <td class="m" style="font-size:11.5px;color:var(--accent-ink)">${h(r.cap)}<div class="sub" style="color:var(--ink-3)">${h(r.title)}</div></td>
        <td class="m">${h(r.t)}</td>
        <td>${r.b?`${tierBadge(r.b.tier)} <span class="kv"><b>${h(r.b.driver)}</b></span>${r.b.status==='experimental'?' <span class="pill p-warn">thử nghiệm</span>':''}`:'<span class="pill p-crit">chưa hỗ trợ</span>'}</td>
        <td class="m" style="font-size:11px">${Object.entries(r.args).filter(([k])=>k!=='device').map(([k,v])=>`${h(k)}=<b>${h(v)}</b>`).join('<br>')}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>

  <div class="sect panel"><div class="hd"><h2>Lệnh sẽ được gửi</h2><div class="sp"></div><span class="eyebrow">chưa gửi gì tới thiết bị</span></div>
    <div class="bd">
      ${rows.filter(r=>r.cmds).map(r=>`<div class="diffbox" style="margin-bottom:11px">
        <div class="dh">${tierBadge(r.tier)}<b style="color:var(--ink)">${h(r.t)}</b> · bước ${r.i} · ${h(r.cap)} · driver ${h(r.b.driver)}</div>
        <pre>${r.cmds.map(l=>l.trim().startsWith('#')||l.trim().startsWith('!')?`<span class="c">${h(l)}</span>`:`<span class="add">+ </span>${h(l)}`).join('\n')}</pre>
      </div>`).join('')}
      ${worst>=3?`<div class="banner b-warn"><svg viewBox="0 0 16 16"><use href="#i-info"/></svg><div class="tx"><b>Với T3/T4 đây là <em>dự đoán</em>, không phải dry-run trên thiết bị</b>
        <p>Thiết bị không có candidate config nên không xác nhận trước được. Nền tảng bù bằng: kiểm tra cấu hình kết quả offline, snapshot bắt buộc, và kiểm chứng sau khi áp — lệch thì tự hoàn.</p></div></div>`:''}
    </div>
  </div>`;
}
</script>

<script>
/* =========================================================================
   VIEW · LỊCH SỬ CHẠY
   ========================================================================= */
VIEWS.runs=()=>`
  <div class="ph"><div><h1>Lịch sử chạy</h1>
    <p class="lede">Mỗi lần chạy là một bản ghi bất biến: plan, lệnh đã gửi, output thô, kết quả kiểm chứng, snapshot trước và sau.</p>
  </div></div>
  <div class="sect panel"><div class="hd"><h2>${RUNS.length} lần chạy gần nhất</h2><div class="sp"></div>
    <span class="pill p-ok">${RUNS.filter(r=>r.status==='success').length} thành công</span>
    <span class="pill p-warn">${RUNS.filter(r=>r.status==='partial').length} một phần</span>
    <span class="pill p-crit">${RUNS.filter(r=>r.status==='failed_rolled_back').length} đã hoàn</span>
    <span class="pill p-mute">${RUNS.filter(r=>r.status==='blocked').length} bị chặn</span></div>
    <div class="bd flush"><div class="tw"><table><thead><tr><th>Run</th><th>Nghiệp vụ</th><th>Người / nguồn</th><th>Đích</th><th>Tầng</th><th>Thời lượng</th><th>Trạng thái</th></tr></thead><tbody>
      ${RUNS.map(r=>{const tiers={};r.targets.forEach(t=>{const x=tierOf(t);tiers[x]=(tiers[x]||0)+1;});
      return `<tr class="clk" data-run="${r.id}"><td class="m">${r.id}<div class="sub">${h(r.at)}</div></td>
        <td>${h(OPBY[r.op].title)}<div class="sub">${h(r.op)} v${r.opv}</div></td>
        <td>${h(r.by)}${r.approvedBy?`<div class="sub">duyệt: ${h(r.approvedBy)}</div>`:''}</td>
        <td class="m">${r.targets.length===1?h(r.targets[0]):r.targets.length+' thiết bị'}</td>
        <td>${Object.entries(tiers).sort().map(([t,n])=>`${tierBadge(t)}${n>1?`<span class="kv">×${n}</span>`:''}`).join(' ')}</td>
        <td class="m">${h(r.dur)}</td><td>${runPill(r.status)}</td></tr>`;}).join('')}
    </tbody></table></div></div>
  </div>`;

/* =========================================================================
   VIEW · CHI TIẾT RUN  (vòng bù trừ 6 bước)
   ========================================================================= */
const LOOP=[
  {t:'Chụp snapshot',s:'kéo full config, ký, lưu'},
  {t:'Đọc + chuẩn hoá',s:'parse về state_shape'},
  {t:'So sánh → delta',s:'chỉ sinh lệnh còn thiếu'},
  {t:'Áp delta',s:'kèm dead-man switch'},
  {t:'Đọc lại + kiểm chứng',s:'so với mong muốn'},
  {t:'Chốt hoặc hoàn',s:'write mem / rollback'},
];
function loopState(runStatus,devId,run){
  if(runStatus==='blocked')return {stop:0,fail:false};
  if(runStatus==='failed_rolled_back')return {stop:6,fail:true};
  if(runStatus==='partial')return devId===run.targets[4]?{stop:6,fail:true}:{stop:6,fail:false};
  return {stop:6,fail:false};
}
VIEWS.run=()=>{
  const r=RUNS.find(x=>x.id===S.p); if(!r) return '<div class="empty">Không tìm thấy run</div>';
  const op=OPBY[r.op];
  const sim=S.runSim;
  return `
  <div class="ph"><div>
    <div class="eyebrow">${h(r.id)} · ${h(r.at)}</div>
    <h1>${h(op.title)}</h1>
    <div class="row" style="margin-top:7px">${runPill(r.status)}<span class="kv"><b>${h(r.op)}</b> v${r.opv}</span><span class="kv">${h(r.by)}</span>
      ${r.approvedBy?`<span class="pill p-info">duyệt bởi ${h(r.approvedBy)}</span>`:''}<span class="kv">${h(r.dur)}</span></div>
  </div><div class="sp"></div><button class="btn" data-go="runs">← Lịch sử</button></div>

  ${r.status==='blocked'?`<div class="banner b-crit"><svg viewBox="0 0 16 16"><use href="#i-shield"/></svg><div class="tx">
    <b>Bị chặn trước khi tới thiết bị</b><p>Policy <code>${h(op.policy.approval)}</code> khớp (<code>${h(r.targets[0])}</code> có role <code>core</code>) và người chạy không có quyền tự duyệt. Không có lệnh nào được gửi.</p></div></div>`:''}
  ${r.status==='failed_rolled_back'?`<div class="banner b-crit"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx">
    <b>Kiểm chứng thất bại ở bước 5 — đã tự hoàn về snapshot</b>
    <p>Thiết bị <code>${h(r.targets[0])}</code> (T4, telnet) nhận lệnh nhưng đọc lại thấy <code>access_vlan = 1</code> thay vì <code>130</code>. Nền tảng khôi phục snapshot <code>snap-20463-pre</code> và đánh dấu run thất bại. Không để lại cấu hình nửa vời.</p></div></div>`:''}
  ${r.status==='partial'?`<div class="banner b-warn"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx">
    <b>5/6 thiết bị thành công · 1 thiết bị đã hoàn</b><p><code>sw-acc-11</code> (T3) không có driver kiểm thử cho <code>interface.trunk_vlans.set</code>; bước đó dùng driver thử nghiệm và kiểm chứng không khớp nên thiết bị này được hoàn về snapshot.</p></div></div>`:''}

  <div class="sect"><div class="hd row"><h2>Đầu vào đã dùng</h2></div>
    <div class="panel"><div class="bd"><div class="dl" style="grid-template-columns:180px 1fr">
      ${Object.entries(r.inputs).map(([k,v])=>`<dt>${h(k)}</dt><dd class="m">${h(v)}</dd>`).join('')}
      <dt>đích</dt><dd class="m">${r.targets.map(t=>`${h(t)} ${tierBadge(tierOf(t))}`).join(' &nbsp; ')}</dd>
    </div></div></div>
  </div>

  <div class="sect"><div class="hd row"><h2>Vòng bù trừ theo từng thiết bị</h2><div class="sp"></div>
    <button class="btn sm" id="btnsim">${sim?'Đang mô phỏng…':'Chạy lại mô phỏng'}</button></div>
    ${r.targets.map(t=>{
      const st=loopState(r.status,t,r);
      const stop=sim!==null?Math.min(sim,st.stop):st.stop;
      return `<div class="panel" style="margin-bottom:12px"><div class="hd">
        <span class="kv"><b>${h(t)}</b></span>${tierBadge(tierOf(t))}
        <span class="kv">${h(PROFILES[dev(t).profile].label)} · ${TIERNAME[tierOf(t)]}</span><div class="sp"></div>
        ${stop===0?'<span class="pill p-mute">không chạy</span>':stop<6?'<span class="pill p-accent">đang chạy</span>':st.fail?'<span class="pill p-crit">đã hoàn về snapshot</span>':'<span class="pill p-ok">đã chốt</span>'}
      </div><div class="bd">
        <div class="loop">${LOOP.map((L,i)=>{
          const n=i+1; let cls='';
          if(n<=stop){ if(n===5&&st.fail&&stop>=5)cls='fail'; else if(n===6&&st.fail)cls='roll'; else cls='done'; }
          if(n===stop&&sim!==null&&stop<6)cls='run';
          const lab=cls==='done'?'✓ xong':cls==='fail'?'✗ lệch':cls==='roll'?'↩ đã hoàn':cls==='run'?'● đang chạy':'· chờ';
          return `<div class="lstep ${cls}"><div class="n">BƯỚC ${n}</div><div class="t">${h(L.t)}</div><div class="s">${lab}</div><div class="s" style="color:var(--ink-3)">${h(L.s)}</div></div>`;
        }).join('')}</div>
        ${stop>=1?`<div class="row" style="margin-top:12px"><span class="kv">snapshot: <b>snap-${r.id.slice(4)}-pre</b></span><span class="kv">hash: <b>a7f3…91c</b></span><span class="kv">${(tierOf(t)>=3?'lệnh nghịch đảo đã sinh sẵn':'candidate config đã tạo')}</span></div>`:''}
      </div></div>`;
    }).join('')}
  </div>

  ${r.status!=='blocked'?`
  <div class="grid g2 sect">
    <div class="panel"><div class="hd"><h2>Lệnh đã gửi</h2><div class="sp"></div><span class="eyebrow">bằng chứng</span></div>
      <div class="bd"><pre>${(()=>{
        const t=r.targets[0],d=dev(t),I=r.inputs;
        const svc=SERVICES.find(s=>s.id===I.service);
        const out=[];
        op.plan.forEach((st,i)=>{
          const args={};Object.entries(st.with).forEach(([k,v])=>args[k]=subst(v,Object.assign({},I,{service:I.service})));
          if(svc&&args.vlan_id==='$service.vlan')args.vlan_id=svc.vlan;
          const b=CAPBY[st.use]&&CAPBY[st.use].bind[d.profile];
          if(!b){out.push(`<span class="c">! bước ${i+1} ${st.use} — không có driver, bỏ qua</span>`);return;}
          out.push(`<span class="c">--- bước ${i+1} · ${st.use} · ${b.driver}</span>`);
          predict(st.use,args,d.profile).forEach(l=>out.push(l.trim().startsWith('#')||l.trim().startsWith('!')?`<span class="c">${h(l)}</span>`:h(l)));
        });
        return out.join('\n');
      })()}</pre></div>
    </div>
    <div class="panel"><div class="hd"><h2>Kết quả kiểm chứng</h2><div class="sp"></div>
      ${r.status==='success'?'<span class="pill p-ok">khớp</span>':r.status==='failed_rolled_back'?'<span class="pill p-crit">lệch</span>':'<span class="pill p-warn">một phần</span>'}</div>
      <div class="bd"><div class="diffbox"><div class="dh">đọc lại sau khi áp · so với trạng thái mong muốn</div><pre>${
        r.status==='failed_rolled_back'
        ? `<span class="c">interfaces[FastEthernet0/18]:</span>\n<span class="del">-  access_vlan: 1          &lt;- đọc được từ thiết bị</span>\n<span class="add">+  access_vlan: 130        &lt;- mong muốn</span>\n<span class="del">-  description: ""</span>\n<span class="add">+  description: PRINTER/CR-4471</span>\n\n<span class="c">→ lệch 2 mục · kích hoạt rollback từ snap-20463-pre</span>`
        : `<span class="c">interfaces[${h(r.inputs.interface||'—')}]:</span>\n   access_vlan: ${h(SERVICES.find(s=>s.id===r.inputs.service)?.vlan||'—')}   <span class="add">✓ khớp</span>\n   description: ${h(r.inputs.service?r.inputs.service+'/'+r.inputs.ticket:'—')}   <span class="add">✓ khớp</span>\n   admin_state: up   <span class="add">✓ khớp</span>\n   oper_status:  up   <span class="add">✓ khớp trong 12s</span>\n\n<span class="c">→ mọi mục khớp · đã write memory · huỷ dead-man switch</span>`
      }</pre></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-go="audit">Xem bản ghi audit</button>
        ${r.status==='failed_rolled_back'?'<button class="btn sm">Tải snapshot trước</button>':''}</div>
      </div>
    </div>
  </div>`:''}`;
};

  const op=OPBY[S.comp]||OPS[0];

      <div class="panel sect"><div class="hd"><h2>Plan — chuỗi capability</h2><div class="sp"></div><span class="eyebrow">${op.plan.length} bước</span>

          ${op.plan.map((st,i)=>{

            const errs=res?res.errs.filter(e=>e.n===i+1):[];
            const wr=res?res.warns.filter(e=>e.n===i+1):[];
            return `<div class="stepcard" style="${errs.length?'border-color:var(--crit)':''}">
              <div class="top"><span class="idx">${i+1}</span>
                <span class="cap">${h(st.use)}</span>
                ${bad?'<span class="pill p-crit">không tồn tại</span>':`<span class="kv">${h(cap.title)}</span><span class="pill ${cap.blast==='site'?'p-crit':cap.blast==='device'?'p-warn':cap.blast==='port'?'p-info':'p-mute'}">${h(cap.blast)}</span>`}
                <div class="sp"></div>
                ${cap?`<button class="btn sm" data-cap="${cap.id}">Hợp đồng</button>`:''}
              </div>
              <div class="args">${Object.entries(st.with).map(([k,v])=>`${h(k)}: <b style="color:var(--brass)">${h(String(v))}</b>`).join('<br>')}</div>
              ${errs.map(e=>`<div class="banner b-crit" style="margin-top:9px;padding:8px 11px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx" style="font-size:12.5px">${e.msg}</div></div>`).join('')}
              ${wr.map(e=>`<div class="banner b-warn" style="margin-top:9px;padding:8px 11px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx" style="font-size:12.5px">${e.msg}</div></div>`).join('')}
            </div>`;
          }).join('')}
          <div class="row" style="margin-top:12px"><button class="btn pri" id="btncompile">Kiểm tra hợp lệ &amp; lưu</button>
            <button class="btn" ${op.status==='draft'?'':'disabled'}>Phát hành</button>
            <span class="kv">biên dịch khi lưu, không đợi lúc chạy</span></div>
        </div>
      </div>

      ${res?compileReport(res,op):''}
    </div>

    <div>
      <div class="panel"><div class="hd"><h2>Policy</h2></div><div class="bd">
        <div class="fld"><label>Vai trò được chạy<span class="schemachip">list&lt;role&gt;</span></label>
          <div>${op.policy.rbac.map(r=>`<span class="pill p-accent" style="margin:2px 4px 2px 0">${h(r)}</span>`).join('')}</div></div>
        <div class="fld"><label>Điều kiện phê duyệt<span class="schemachip">expr</span></label><input class="mono" type="text" value="${h(op.policy.approval)}"></div>
        <div class="fld"><label>Cửa sổ thay đổi</label><select class="mono"><option ${op.policy.window==='any'?'selected':''}>any</option><option ${op.policy.window==='business_hours'?'selected':''}>business_hours</option><option ${op.policy.window==='maintenance'?'selected':''}>maintenance</option></select></div>
        <div class="grid g2" style="gap:10px">
          <div class="fld" style="margin:0"><label>Đồng thời / thiết bị</label><input class="mono" type="number" value="${op.policy.conc.per_device}" readonly></div>
          <div class="fld" style="margin:0"><label>Đồng thời / site</label><input class="mono" type="number" value="${op.policy.conc.per_site}"></div>
        </div>
        <div class="hint" style="margin-top:8px">Đồng thời trên một thiết bị bị khoá ở 1 và không sửa được — đây là mutex cấp nền tảng.</div>
      </div></div>

      <div class="panel sect"><div class="hd"><h2>Kiểm chứng</h2></div><div class="bd">
        ${op.verify.map(v=>`<div class="fld"><label>Điều kiện mong đợi</label><input class="mono" type="text" value="${h(v.expect)}">
          <div class="row" style="margin-top:8px"><span class="kv">timeout <b>${h(v.timeout)}</b></span><span class="pill ${v.on_fail==='rollback'?'p-crit':'p-mute'}">on_fail: ${h(v.on_fail)}</span></div></div>`).join('')}
      </div></div>

      <div class="panel sect"><div class="hd"><h2>Phạm vi &amp; profile bị ảnh hưởng</h2></div><div class="bd">
        ${(()=>{const t=DEVICES.filter(d=>matchScope(op,d));const ps=[...new Set(t.map(d=>d.profile))];
        return `<div class="kv" style="margin-bottom:9px">scope: <b>${h(JSON.stringify(op.scope))}</b> → <b>${t.length}</b> thiết bị, <b>${ps.length}</b> profile</div>
        <ul class="ownlist">${ps.map(p=>`<li>${tierBadge(PROFILES[p].tier)}<span style="flex:1">${h(PROFILES[p].label)}</span><b>${t.filter(d=>d.profile===p).length}</b></li>`).join('')}</ul>`;})()}
      </div></div>
    </div>
  </div>`;
};

function compileReport(r,op){
  const okAll=r.errs.length===0;
  return `<div class="sect panel" style="border-color:${okAll?'var(--ok)':'var(--crit)'}">
    <div class="hd"><h2>Kết quả biên dịch</h2><div class="sp"></div>
      <span class="pill ${okAll?'p-ok':'p-crit'}">${okAll?'hợp lệ — có thể lưu':r.errs.length+' lỗi — không lưu được'}</span>
      ${r.warns.length?`<span class="pill p-warn">${r.warns.length} cảnh báo</span>`:''}
      ${r.infos.length?`<span class="pill p-info">${r.infos.length} ghi chú</span>`:''}</div>
    <div class="bd">
      <div class="kv" style="margin-bottom:11px">Kiểm tra trên <b>${r.targets.length}</b> thiết bị thuộc <b>${r.profs.length}</b> profile trong phạm vi.</div>
      ${r.errs.length?`<h3 style="color:var(--crit);margin-bottom:7px">Lỗi — chặn lưu</h3>${r.errs.map(e=>`<div class="banner b-crit" style="margin-top:7px;padding:9px 12px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx" style="font-size:12.5px"><b>Bước ${e.n}</b>${e.msg}</div></div>`).join('')}`:''}
      ${r.warns.length?`<h3 style="color:var(--warn);margin:16px 0 7px">Cảnh báo — lưu được nhưng cần biết</h3>${r.warns.map(e=>`<div class="banner b-warn" style="margin-top:7px;padding:9px 12px"><svg viewBox="0 0 16 16"><use href="#i-warn"/></svg><div class="tx" style="font-size:12.5px"><b>Bước ${e.n}</b>${e.msg}</div></div>`).join('')}`:''}
      ${r.infos.length?`<h3 style="color:var(--info);margin:16px 0 7px">Ghi chú</h3>${r.infos.map(e=>`<div class="banner b-info" style="margin-top:7px;padding:9px 12px"><svg viewBox="0 0 16 16"><use href="#i-info"/></svg><div class="tx" style="font-size:12.5px"><b>Bước ${e.n}</b>${e.msg}</div></div>`).join('')}`:''}
      ${okAll&&!r.warns.length?`<div class="banner b-ok"><svg viewBox="0 0 16 16"><use href="#i-check"/></svg><div class="tx"><b>Mọi bước có driver đã kiểm thử cho toàn bộ profile trong phạm vi</b><p>Nghiệp vụ này chạy được trên cả thiết bị mới và thiết bị cũ trong phạm vi mà không cần sửa gì.</p></div></div>`:''}
    </div></div>`;
}
</script>

<script>
/* =========================================================================
   VIEW · THIẾT BỊ & REGISTRY
   ========================================================================= */
VIEWS.devices=()=>`
  <div class="ph"><div><h1>Thiết bị &amp; Registry</h1>
    <p class="lede">Driver không gắn vào từng thiết bị mà gắn vào <b>profile</b>. ${DEVICES.length} thiết bị rơi vào ${Object.keys(PROFILES).length} profile — thêm thiết bị cùng profile tốn 0 công.</p>
  </div><div class="sp"></div><button class="btn pri" id="btnprobe"><svg viewBox="0 0 16 16"><use href="#i-plus"/></svg>Onboard thiết bị (probe)</button></div>

  <div id="probebox"></div>

  <div class="sect panel"><div class="hd"><h2>Danh sách thiết bị</h2><div class="sp"></div>
    ${[1,2,3,4].map(t=>`${tierBadge(t)}<span class="kv" style="margin:0 9px 0 3px">${DEVICES.filter(d=>PROFILES[d.profile].tier===t).length}</span>`).join('')}</div>
    <div class="bd flush"><div class="tw"><table><thead><tr><th>Thiết bị</th><th>IP quản trị</th><th>Profile</th><th>Tầng</th><th>Site / role</th><th class="num">Capability</th><th>Mục nền tảng sở hữu</th><th>Tình trạng</th></tr></thead><tbody>
      ${DEVICES.map(d=>{const p=PROFILES[d.profile];
        const n=CAPS.filter(c=>c.bind[d.profile]).length;
        return `<tr class="clk" data-dev="${d.id}"><td class="m">${h(d.id)}</td><td class="m">${h(d.ip)}</td>
        <td class="m" style="font-size:11.5px">${h(p.label)}</td><td>${tierBadge(p.tier)}</td>
        <td class="m" style="font-size:11.5px">${h(d.site)}<div class="sub">${h(d.role)}</div></td>
        <td class="num">${n}/${CAPS.length}</td>
        <td class="m" style="font-size:10.5px;color:var(--ink-3)">${d.owned.map(h).join(' · ')}</td>
        <td>${d.health==='ok'?'<span class="pill p-ok">bình thường</span>':d.health==='drift'?'<span class="pill p-warn">có drift</span>':'<span class="pill p-crit">không tới được</span>'}</td></tr>`;}).join('')}
    </tbody></table></div></div>
  </div>`;

VIEWS.device=()=>{
  const d=dev(S.p); if(!d) return '<div class="empty">Không tìm thấy thiết bị</div>';
  const p=PROFILES[d.profile], drifts=DRIFT.filter(x=>x.device===d.id), runs=RUNS.filter(r=>r.targets.includes(d.id));
  return `
  <div class="ph"><div>
    <div class="eyebrow">${h(d.site)} · ${h(d.role)} · ${h(d.ip)}</div>
    <h1 style="font-family:var(--mono);font-size:20px">${h(d.id)}</h1>
    <div class="row" style="margin-top:7px">${tierBadge(p.tier)}<span class="kv"><b>${h(p.label)}</b> · ${TIERNAME[p.tier]}</span>
      ${d.health==='unreachable'?'<span class="pill p-crit">không tới được</span>':d.health==='drift'?'<span class="pill p-warn">có drift</span>':'<span class="pill p-ok">bình thường</span>'}</div>
  </div><div class="sp"></div><button class="btn" data-go="devices">← Danh sách</button></div>

  <div class="grid g2 sect" style="align-items:start">
    <div class="panel"><div class="hd"><h2>Profile &amp; năng lực</h2></div><div class="bd">
      <div class="dl" style="grid-template-columns:150px 1fr">
        <dt>profile</dt><dd class="m">${h(d.profile)}</dd>
        <dt>tầng năng lực</dt><dd>${tierBadge(p.tier)} <span class="kv">${TIERNAME[p.tier]}</span></dd>
        <dt>giao thức dò được</dt><dd class="m" style="font-size:11.5px">${p.proto.map(h).join(' · ')}</dd>
        <dt>idempotent</dt><dd>${p.tier<=2?'<span class="pill p-ok">có</span>':p.tier===3?'<span class="pill p-warn">nền tảng bù</span>':'<span class="pill p-crit">không</span>'}</dd>
        <dt>diff trước khi áp</dt><dd>${p.tier<=2?'<span class="pill p-ok">có</span>':p.tier===3?'<span class="pill p-warn">theo dòng</span>':'<span class="pill p-crit">không</span>'}</dd>
        <dt>rollback</dt><dd>${p.tier===1?'<span class="pill p-ok">thiết bị hỗ trợ</span>':'<span class="pill p-warn">từ snapshot</span>'}</dd>
      </div>
      <h3 style="margin:16px 0 8px">Mục cấu hình nền tảng sở hữu</h3>
      <ul class="ownlist">${d.owned.map(o=>`<li><span class="pill p-accent">quản</span><span style="flex:1">${h(o)}</span></li>`).join('')}
        <li><span class="pill p-mute">không quản</span><span style="flex:1;color:var(--ink-3)">mọi mục còn lại — giữ nguyên, không hoà giải</span></li></ul>
      <div class="banner b-info" style="margin-top:12px"><svg viewBox="0 0 16 16"><use href="#i-info"/></svg><div class="tx"><b>Sở hữu một phần</b>
        <p>Bộ hoà giải chỉ can thiệp vào ${d.owned.length} mục trên. Không có mô hình này, lần hoà giải đầu tiên sẽ xoá cấu hình chưa ai kịp đưa vào nguồn sự thật.</p></div></div>
    </div></div>

    <div>
      <div class="panel"><div class="hd"><h2>Capability khả dụng</h2><div class="sp"></div>
        <span class="pill p-ok">${CAPS.filter(c=>c.bind[d.profile]&&c.bind[d.profile].status==='tested').length} kiểm thử</span>
        <span class="pill p-warn">${CAPS.filter(c=>c.bind[d.profile]&&c.bind[d.profile].status==='experimental').length} thử nghiệm</span>
        <span class="pill p-mute">${CAPS.filter(c=>!c.bind[d.profile]).length} chưa hỗ trợ</span></div>
        <div class="bd flush"><div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>Capability</th><th>Driver</th><th>Trạng thái</th></tr></thead><tbody>
          ${CAPS.map(c=>{const b=c.bind[d.profile];return `<tr class="clk" data-cap="${c.id}"><td class="m" style="font-size:11.5px;color:${b?'var(--accent-ink)':'var(--ink-3)'}">${h(c.id)}</td>
            <td class="m" style="font-size:11px">${b?h(b.driver):'—'}</td>
            <td>${b?(b.status==='tested'?'<span class="pill p-ok">kiểm thử</span>':'<span class="pill p-warn">thử nghiệm</span>'):'<span class="pill p-mute">chưa hỗ trợ</span>'}</td></tr>`;}).join('')}
        </tbody></table></div></div>
      </div>

      <div class="panel sect"><div class="hd"><h2>Lịch sử &amp; drift</h2></div><div class="bd">
        ${drifts.length?`<h3 style="margin-bottom:7px">Drift đang mở (${drifts.length})</h3>${drifts.map(x=>`<div class="stepcard"><div class="top">
          <span class="cap" style="color:${x.sev==='high'?'var(--crit)':'var(--warn)'}">${h(x.path)}</span><div class="sp"></div>
          <span class="pill ${x.sev==='high'?'p-crit':x.sev==='medium'?'p-warn':'p-mute'}">${h(x.sev)}</span>${x.owned?'':'<span class="pill p-mute">không quản</span>'}</div>
          <div class="args" style="padding-left:0;margin-top:6px">mong muốn: <b style="color:var(--ok)">${h(x.want)}</b><br>thực tế: <b style="color:var(--crit)">${h(x.got)}</b></div></div>`).join('')}`:'<div class="kv">Không có drift.</div>'}
        <h3 style="margin:16px 0 7px">Lần chạy gần đây (${runs.length})</h3>
        <ul class="timeline">${runs.map(r=>`<li><span class="mk" style="color:${r.status==='success'?'var(--ok)':'var(--crit)'};border-color:currentColor">${r.status==='success'?'✓':'✗'}</span>
          <div><div class="ti">${h(OPBY[r.op].title)}</div><div class="tm">${h(r.id)} · ${h(r.at)} · ${h(r.by)}</div>
          <button class="btn sm" style="margin-top:6px" data-run="${r.id}">Xem run</button></div></li>`).join('')||'<div class="kv">Chưa có.</div>'}</ul>
      </div></div>
    </div>
  </div>`;
};

/* =========================================================================
   VIEW · MA TRẬN DRIVER
   ========================================================================= */
VIEWS.drivers=()=>{
  const profs=Object.keys(PROFILES);
  return `
  <div class="ph"><div><h1>Driver &amp; tầng năng lực</h1>
    <p class="lede">Ma trận (capability × profile) là nguồn sự thật để Composer báo lỗi ngay khi lưu, và để Planner chọn driver lúc chạy.</p>
  </div><div class="sp"></div>
    <span class="row"><span class="cell c-tested">✓</span><span class="kv">kiểm thử</span><span class="cell c-exp">~</span><span class="kv">thử nghiệm</span><span class="cell c-none">·</span><span class="kv">chưa hỗ trợ</span></span></div>

  <div class="sect panel"><div class="hd"><h2>${CAPS.length} capability × ${profs.length} profile</h2><div class="sp"></div>
    <span class="pill p-ok">${CAPS.reduce((a,c)=>a+Object.values(c.bind).filter(b=>b.status==='tested').length,0)} binding đã kiểm thử</span>
    <span class="pill p-warn">${CAPS.reduce((a,c)=>a+Object.values(c.bind).filter(b=>b.status==='experimental').length,0)} thử nghiệm</span></div>
    <div class="bd flush"><div class="mx"><table><thead><tr><th>Capability</th>
      ${profs.map(p=>`<th class="rot">T${PROFILES[p].tier} · ${h(PROFILES[p].label)}</th>`).join('')}<th>Phủ</th></tr></thead><tbody>
      ${CAPS.map(c=>{const cov=Object.keys(c.bind).length;
        return `<tr><td>${h(c.id)}</td>${profs.map(p=>{const b=c.bind[p];
          return `<td title="${h(b?b.driver:'chưa hỗ trợ')}">${b?`<span class="cell ${b.status==='tested'?'c-tested':'c-exp'}">${b.status==='tested'?'✓':'~'}</span>`:'<span class="cell c-none">·</span>'}</td>`;}).join('')}
          <td class="m">${cov}/${profs.length}</td></tr>`;}).join('')}
    </tbody></table></div></div>
  </div>

  <div class="grid g2 sect">
    <div class="panel"><div class="hd"><h2>Bốn tầng và mức đảm bảo</h2></div><div class="bd flush"><div class="tw"><table>
      <thead><tr><th>Tầng</th><th>Cơ chế</th><th>Idempotent</th><th>Diff</th><th>Rollback</th></tr></thead><tbody>
      <tr><td>${tierBadge(1)} model-driven</td><td class="m" style="font-size:11.5px">NETCONF/YANG · gNMI · REST</td><td><span class="pill p-ok">có</span></td><td><span class="pill p-ok">có</span></td><td><span class="pill p-ok">thiết bị lo</span></td></tr>
      <tr><td>${tierBadge(2)} resource module</td><td class="m" style="font-size:11.5px">Ansible structured</td><td><span class="pill p-ok">có</span></td><td><span class="pill p-ok">có</span></td><td><span class="pill p-warn">snapshot</span></td></tr>
      <tr><td>${tierBadge(3)} CLI template</td><td class="m" style="font-size:11.5px">Jinja render + SSH</td><td><span class="pill p-warn">một phần</span></td><td><span class="pill p-warn">theo dòng</span></td><td><span class="pill p-warn">snapshot</span></td></tr>
      <tr><td>${tierBadge(4)} screen-scrape</td><td class="m" style="font-size:11.5px">telnet · console server</td><td><span class="pill p-crit">không</span></td><td><span class="pill p-crit">không</span></td><td><span class="pill p-crit">chỉ toàn phần</span></td></tr>
    </tbody></table></div></div></div>

    <div class="panel"><div class="hd"><h2>Luật an toàn tự áp theo tầng</h2></div><div class="bd">
      <ul class="ownlist">
        <li>${tierBadge(1)}<span style="flex:1">commit confirmed, candidate config</span><span class="pill p-ok">nhẹ</span></li>
        <li>${tierBadge(2)}<span style="flex:1">snapshot + diff trước khi áp</span><span class="pill p-ok">nhẹ</span></li>
        <li>${tierBadge(3)}<span style="flex:1">snapshot bắt buộc · kiểm chứng bắt buộc · serial 1</span><span class="pill p-warn">siết</span></li>
        <li>${tierBadge(4)}<span style="flex:1">tất cả của T3 + phê duyệt bắt buộc + dead-man switch + kiểm tra offline</span><span class="pill p-crit">siết mạnh</span></li>
      </ul>
      <div class="banner b-info" style="margin-top:14px"><svg viewBox="0 0 16 16"><use href="#i-info"/></svg><div class="tx">
        <b>Người vận hành không cấu hình những luật này</b><p>Chúng suy ra từ tầng của thiết bị trong phạm vi. Cùng một nghiệp vụ chạy trên switch mới thì trơn, trên switch cũ thì tự siết.</p></div></div>
    </div></div>
  </div>`;
};

/* =========================================================================
   VIEW · DESIRED STATE & DRIFT
   ========================================================================= */
VIEWS.drift=()=>{
  const owned=DRIFT.filter(d=>d.owned);
  return `
  <div class="ph"><div><h1>Desired State &amp; Drift</h1>
    <p class="lede">Tác vụ không tác động trực tiếp lên thiết bị — nó ghi vào trạng thái mong muốn, rồi bộ hoà giải mới đẩy thiết bị theo. Cùng một động cơ cho cả hai chế độ, nên không có drift war.</p>
  </div><div class="sp"></div><button class="btn pri" id="btnrecon">Hoà giải ${owned.length} mục</button></div>

  <div class="grid g3 sect">
    <div class="stat"><div class="stripe" style="background:var(--crit)"></div><div class="k">Drift mục đang quản</div><div class="v">${owned.length}</div><div class="d">phát hiện ở lần so gần nhất 06:00</div></div>
    <div class="stat"><div class="stripe" style="background:var(--ink-3)"></div><div class="k">Lệch ở mục không quản</div><div class="v">${DRIFT.length-owned.length}</div><div class="d">chỉ ghi nhận, không hoà giải</div></div>
    <div class="stat"><div class="stripe" style="background:var(--ok)"></div><div class="k">Thiết bị đúng trạng thái</div><div class="v">${DEVICES.length-new Set(owned.map(d=>d.device)).size}</div><div class="d">trên tổng ${DEVICES.length} thiết bị</div></div>
  </div>

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-run],[data-cap],[data-dev],[data-launch],[data-comp],[data-approve],[data-reject],[data-recon]');
  if(t){
    if(t.dataset.go) return go(t.dataset.go);
    if(t.dataset.run) return go('run',t.dataset.run);
    if(t.dataset.cap) return go('cap',t.dataset.cap);
    if(t.dataset.dev) return go('device',t.dataset.dev);
    if(t.dataset.comp){S.comp=t.dataset.comp;S.compRes=null;return go('composer');}
    if(t.dataset.launch){S.launch={op:t.dataset.launch,inputs:{},planned:false};return go('launch');}
    if(t.dataset.approve){const a=APPROVALS.find(x=>x.id===t.dataset.approve);a.state='approved';alert('Đã duyệt '+a.id+'.\n\nPlan được đưa vào hàng đợi thực thi với serial=1 và snapshot bắt buộc (phạm vi có thiết bị T'+Math.max(...a.targets.map(tierOf))+').');return render();}
    if(t.dataset.reject){const a=APPROVALS.find(x=>x.id===t.dataset.reject);const i=APPROVALS.indexOf(a);APPROVALS.splice(i,1);return render();}
    if(t.dataset.recon){const i=DRIFT.findIndex(x=>x.id===t.dataset.recon);const d=DRIFT[i];
      alert('Hoà giải '+d.id+' trên '+d.device+'\n\nĐi qua đúng vòng bù trừ như một tác vụ:\n1 snapshot → 2 đọc+chuẩn hoá → 3 delta → 4 áp → 5 kiểm chứng → 6 chốt.\n\nMục '+d.path+' thuộc phạm vi nền tảng sở hữu nên được phép sửa.');
      DRIFT.splice(i,1);return render();}
  }
  if(e.target.closest('#sbtoggle')) return $('#sb').classList.toggle('open');
  if(e.target.closest('#themebtn')){
    const cur=document.documentElement.getAttribute('data-theme');
    const dark=cur? cur==='dark' : window.matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');return;
  }
  if(e.target.closest('#btnplan')){S.launch.planned=true;return render();}
  if(e.target.closest('#btnfill')){
    const op=OPBY[S.launch.op];const I={};
    op.form.forEach(f=>{
      if(f.type==='device_picker')I[f.id]=DEVICES.filter(d=>!f.filter||!f.filter.role||d.role===f.filter.role)[0].id;
      else if(f.type==='interface_picker')I[f.id]=(ifaces(I[f.of])||[]).filter(x=>x.free)[0]?.name||'';
      else if(f.type==='enum')I[f.id]=f.source==='services'?SERVICES[2].id:f.source==='ports'?PORTS[0].id:SITES[1];
      else if(f.type==='integer')I[f.id]=160;
      else I[f.id]=f.ph||'CR-9001';
    });
    S.launch.inputs=I;S.launch.planned=false;return render();
  }
  if(e.target.closest('#btnexec')){
    const op=OPBY[S.launch.op];const worst=Math.max(0,...resolveTargets(op,S.launch.inputs).map(tierOf));
    const need=op.policy.approval==='always'||(op.policy.approval!=='none'&&worst===4);
    alert(need?'Đã gửi vào hàng chờ phê duyệt.\n\nLý do: policy "'+op.policy.approval+'"'+(worst===4?' và phạm vi có thiết bị T4':'')+'.\nKhông có lệnh nào được gửi tới thiết bị.'
      :'Đang áp thay đổi.\n\nMỗi thiết bị đi qua vòng bù trừ 6 bước; lệch ở bước kiểm chứng sẽ tự hoàn về snapshot.\n\nMở màn hình "Lịch sử chạy" để xem tiến trình.');
    return;
  }
  if(e.target.closest('#btncompile')){
    const op=OPBY[S.comp];S.compRes={id:op.id,r:compileOp(op)};return render();
  }
  if(e.target.closest('#btnprobe')){
    const box=$('#probebox');
    box.innerHTML=`<div class="panel sect" style="border-color:var(--accent)"><div class="hd"><h2>Kết quả probe · 10.30.0.13</h2><div class="sp"></div><span class="pill p-accent">tự dò, không nhập tay</span></div>
      <div class="bd"><ul class="timeline">
        <li><span class="mk" style="color:var(--crit);border-color:currentColor">✗</span><div><div class="ti">NETCONF cổng 830</div><div class="tm">không phản hồi &lt;hello&gt; sau 5s</div></div></li>
        <li><span class="mk" style="color:var(--crit);border-color:currentColor">✗</span><div><div class="ti">RESTCONF / gNMI</div><div class="tm">443 và 57400 đóng</div></div></li>
        <li><span class="mk" style="color:var(--ok);border-color:currentColor">✓</span><div><div class="ti">SSH cổng 22</div><div class="tm">banner: Cisco IOS · cần KexAlgorithms=+diffie-hellman-group14-sha1</div></div></li>
        <li><span class="mk" style="color:var(--ok);border-color:currentColor">✓</span><div><div class="ti">show version</div><div class="tm">IOS 15.2(7)E3 · WS-C2960X-48TS-L</div></div></li>
        <li><span class="mk" style="color:var(--accent);border-color:currentColor">→</span><div><div class="ti">Suy ra profile: <code>cisco.ios.15x</code></div>
          <div class="tm">tầng ${'T3'} · CLI template · ${CAPS.filter(c=>c.bind['cisco.ios.15x']).length}/${CAPS.length} capability khả dụng ngay</div>
          <div class="row" style="margin-top:8px"><button class="btn pri sm">Thêm vào registry</button><button class="btn sm" data-go="drivers">Xem capability khả dụng</button></div></div></li>
      </ul>
      <div class="banner b-ok" style="margin-top:6px"><svg viewBox="0 0 16 16"><use href="#i-check"/></svg><div class="tx">
        <b>Thiết bị mới nhưng profile đã biết — tốn 0 công viết driver</b><p>Đây là lý do driver gắn vào profile chứ không gắn vào từng thiết bị.</p></div></div>
      </div></div>`;
    box.scrollIntoView({behavior:'smooth',block:'nearest'});return;
  }
  if(e.target.closest('#btnrecon')){
    alert('Hoà giải '+DRIFT.filter(d=>d.owned).length+' mục đang quản.\n\nThiết bị T1/T2: hoà giải tự động.\nThiết bị T3: hoà giải với snapshot + kiểm chứng bắt buộc.\nThiết bị T4: chỉ đưa vào hàng chờ duyệt, không tự áp.');
    return;
  }
  if(e.target.closest('#btnsim')){
    if(S.runSim!==null)return;
    const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce){S.runSim=null;return render();}
    S.runSim=0;render();
    const iv=setInterval(()=>{S.runSim++;if(S.runSim>=6){clearInterval(iv);S.runSim=null;}render();},560);
    return;
  }
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.fld;
  if(f){
    S.launch.inputs[f]=e.target.value;
    if(f==='device')delete S.launch.inputs.interface;
    if(f==='site')S.launch.planned=false;
    S.launch.planned=false;return render();
  }
  if(e.target.id==='compsel'){S.comp=e.target.value;S.compRes=null;return render();}
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.fld;
  if(f&&e.target.type==='text'){S.launch.inputs[f]=e.target.value;}
});

render();
</script>
