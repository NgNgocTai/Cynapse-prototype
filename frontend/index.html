<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE - Network Automation Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">SYNAPSE</h1>
            <div class="header-controls">
                <div class="role-selector">
                    <label>Role</label>
                    <select id="roleSelect">
                        <option value="operator">Network Operator</option>
                        <option value="bo">BO Automation Engineer</option>
                        <option value="reviewer">Automation Reviewer</option>
                        <option value="admin">Platform Admin</option>
                    </select>
                </div>
                <div class="user-info">
                    <span class="user-badge">O</span>
                    <span id="currentRole">Network Operator</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Navigation -->
    <nav class="main-nav">
        <div class="nav-section">
            <h3>Automation Studio</h3>
            <ul>
                <li><a href="#" data-view="actions">Actions</a></li>
                <li><a href="#" data-view="blueprints">Blueprints</a></li>
            </ul>
        </div>
        <div class="nav-section">
            <h3>Infrastructure</h3>
            <ul>
                <li><a href="#" data-view="credentials">Credentials</a></li>
                <li><a href="#" data-view="inventory">Inventory</a></li>
            </ul>
        </div>
        <div class="nav-section">
            <h3>Operations</h3>
            <ul>
                <li><a href="#" data-view="home">Home</a></li>
                <li><a href="#" data-view="changes">Changes</a></li>
                <li><a href="#" data-view="executions">Executions</a></li>
                <li><a href="#" data-view="audit">Audit</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; color: #9ca3af; gap: 1rem;">
            <div class="loading-spinner" style="width: 36px; height: 36px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <div style="font-size: 0.9rem; font-weight: 500; color: #cbd5e1;">Loading Synapse Automation Engine...</div>
        </div>
    </main>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <script src="app.js"></script>
</body>

</html>
