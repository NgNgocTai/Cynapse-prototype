---
- name: "{{ action_name }}"
  hosts: "{{ target_group }}"
  gather_facts: false
  tasks:
{% if check_type == "http" %}
    - name: HTTP health check - {{ endpoint }}
      ansible.builtin.uri:
        url: "{{ endpoint }}"
        method: GET
        timeout: "{{ timeout }}"
        validate_certs: false
      register: http_result

    - name: Verify HTTP response
      ansible.builtin.assert:
        that:
          - http_result.status == 200 or http_result.status == 204
        fail_msg: "HTTP health check failed: {{ http_result.status }}"
        success_msg: "HTTP health check passed: {{ http_result.status }}"

    - name: Print HTTP response
      ansible.builtin.debug:
        msg: "Health check OK - Status: {{ http_result.status }}"
{% endif %}

{% if check_type == "tcp" %}
    - name: TCP port check - {{ endpoint }}
      ansible.builtin.wait_for:
        port: "{{ endpoint }}"
        timeout: "{{ timeout }}"
        state: started
      register: tcp_result

    - name: Print TCP check result
      ansible.builtin.debug:
        msg: "TCP port {{ endpoint }} is open and responding"
{% endif %}

{% if check_type == "process" %}
    - name: Check if process {{ endpoint }} is running
      ansible.builtin.shell: pgrep -f "{{ endpoint }}" | wc -l
      register: process_count
      changed_when: false

    - name: Verify process is running
      ansible.builtin.assert:
        that:
          - process_count.stdout | int > 0
        fail_msg: "Process {{ endpoint }} is not running"
        success_msg: "Process {{ endpoint }} is running ({{ process_count.stdout }} instances)"

    - name: Print process check result
      ansible.builtin.debug:
        msg: "Process {{ endpoint }} is running - {{ process_count.stdout }} instance(s) found"
{% endif %}
