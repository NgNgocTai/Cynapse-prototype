# db_maintenance.yml — Generated by SYNAPSE Blueprint Orchestrator
# Composable Orchestration: Multi-play data flow via set_fact & host facts
---

# ==========================================
# ACTION 1: Pre-check Health
# INPUT:  action1.clickhouse_url, action1.clickhouse_timeout, action1.postgres_service
# OUTPUT: output_action1 (is_ch_ok, is_pg_ok, ch_status_code, pg_state)
# ==========================================
- name: "Action 1: Pre-check DB Services"
  hosts: "{{ target_hosts }}"
  gather_facts: yes
  vars:
    ch_url: "{{ action1.clickhouse_url | default('http://127.0.0.1:8123/ping') }}"
    ch_timeout: "{{ action1.clickhouse_timeout | default(10) }}"
    pg_svc: "{{ action1.postgres_service | default('postgresql@18-main.service') }}"
  tasks:
    - name: 1.1 Ping ClickHouse HTTP
      ansible.builtin.uri:
        url: "{{ ch_url }}"
        timeout: "{{ ch_timeout }}"
      register: ch_health
      failed_when: false

    - name: 1.2 Check PostgreSQL Systemd Status
      ansible.builtin.systemd:
        name: "{{ pg_svc }}"
      register: pg_health
      failed_when: false

    - name: 1.3 Export OUTPUT cho Action sau
      ansible.builtin.set_fact:
        output_action1:
          is_ch_ok: "{{ ch_health.status | default(0) == 200 }}"
          is_pg_ok: "{{ pg_health.status.ActiveState | default('') == 'active' }}"
          ch_status_code: "{{ ch_health.status | default(0) }}"
          pg_state: "{{ pg_health.status.ActiveState | default('unknown') }}"

    - name: 1.4 Show Action 1 Output
      ansible.builtin.debug:
        msg: "OUTPUT Action 1 → {{ output_action1 }}"

# ==========================================
# ACTION 2: Restart Cycle (Stop → Reboot → Start)
# INPUT:  action2.clickhouse_service, action2.postgres_service, action2.reboot_timeout
# INPUT FROM ACTION 1: output_action1 (tự động có)
# OUTPUT: output_action2 (restart_timestamp, uptime)
# ==========================================
- name: "Action 2: Restart Services"
  hosts: "{{ target_hosts }}"
  become: true
  gather_facts: yes
  vars:
    ch_svc: "{{ action2.clickhouse_service | default('clickhouse-server') }}"
    pg_svc: "{{ action2.postgres_service | default('postgresql@18-main.service') }}"
    rb_timeout: "{{ action2.reboot_timeout | default(300) }}"
  tasks:
    - name: 2.0 Show INPUT nhận từ Action 1
      ansible.builtin.debug:
        msg: "INPUT from Action 1 → ClickHouse OK: {{ output_action1.is_ch_ok }}, PostgreSQL OK: {{ output_action1.is_pg_ok }}"

    - name: 2.1 Stop ClickHouse service
      ansible.builtin.systemd_service:
        name: "{{ ch_svc }}"
        state: stopped

    - name: 2.2 Stop PostgreSQL service
      ansible.builtin.systemd_service:
        name: "{{ pg_svc }}"
        state: stopped

    - name: 2.3 Reboot server
      ansible.builtin.reboot:
        reboot_timeout: "{{ rb_timeout }}"
        connect_timeout: 20
        pre_reboot_delay: 5
        post_reboot_delay: 15
        test_command: uptime

    - name: 2.4 Check uptime after reboot
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: 2.5 Start ClickHouse service
      ansible.builtin.systemd_service:
        name: "{{ ch_svc }}"
        state: started

    - name: 2.6 Start PostgreSQL service
      ansible.builtin.systemd_service:
        name: "{{ pg_svc }}"
        state: started

    - name: 2.7 Export OUTPUT cho Action sau
      ansible.builtin.set_fact:
        output_action2:
          restart_timestamp: "{{ ansible_date_time.iso8601 }}"
          uptime: "{{ uptime_result.stdout }}"

    - name: 2.8 Show Action 2 Output
      ansible.builtin.debug:
        msg: "OUTPUT Action 2 → {{ output_action2 }}"

# ==========================================
# ACTION 3: Post-Restart Verification
# INPUT:  action3.clickhouse_url, action3.postgres_service
# INPUT FROM ACTION 1: output_action1 (pre-check status)
# INPUT FROM ACTION 2: output_action2.restart_timestamp
# OUTPUT: output_action3.final_verdict (PASS/FAIL)
# ==========================================
- name: "Action 3: Verify Post-Restart Health"
  hosts: "{{ target_hosts }}"
  gather_facts: no
  vars:
    ch_url: "{{ action3.clickhouse_url | default('http://127.0.0.1:8123/ping') }}"
    pg_svc: "{{ action3.postgres_service | default('postgresql@18-main.service') }}"
  tasks:
    - name: 3.1 Re-check ClickHouse Ping
      ansible.builtin.uri:
        url: "{{ ch_url }}"
        timeout: 10
      register: verify_ch
      failed_when: false

    - name: 3.2 Re-check PostgreSQL Status
      ansible.builtin.systemd:
        name: "{{ pg_svc }}"
      register: verify_pg

    - name: 3.3 Assert cả 2 service đã phục hồi
      ansible.builtin.assert:
        that:
          - verify_ch.status == 200
          - verify_pg.status.ActiveState == 'active'
        fail_msg: "CRITICAL: Restart cycle failed!"
        success_msg: "SUCCESS: ClickHouse & PostgreSQL are HEALTHY!"

    - name: 3.4 Export OUTPUT cuối cùng
      ansible.builtin.set_fact:
        output_action3:
          ch_final: "{{ verify_ch.status | default(0) }}"
          pg_final: "{{ verify_pg.status.ActiveState | default('unknown') }}"
          verdict: "{{ 'PASS' if (verify_ch.status == 200 and verify_pg.status.ActiveState == 'active') else 'FAIL' }}"

    - name: 3.5 Final Report (dùng data từ cả 3 Action)
      ansible.builtin.debug:
        msg:
          - "========== BLUEPRINT EXECUTION REPORT =========="
          - "Host              : {{ target_hosts }}"
          - "--- Action 1 (Pre-check) ---"
          - "  ClickHouse was  : {{ output_action1.is_ch_ok }} (HTTP {{ output_action1.ch_status_code }})"
          - "  PostgreSQL was  : {{ output_action1.is_pg_ok }} ({{ output_action1.pg_state }})"
          - "--- Action 2 (Restart) ---"
          - "  Restarted at    : {{ output_action2.restart_timestamp }}"
          - "  Server uptime   : {{ output_action2.uptime }}"
          - "--- Action 3 (Verify) ---"
          - "  ClickHouse now  : HTTP {{ output_action3.ch_final }}"
          - "  PostgreSQL now  : {{ output_action3.pg_final }}"
          - "  VERDICT         : {{ output_action3.verdict }}"
          - "================================================"
